services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - nexusflow-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexusflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql+asyncpg://nexusflow:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-nexusflow}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-change-this-auth-secret-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql+asyncpg://nexusflow:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-nexusflow}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-change-this-auth-secret-in-production}
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  nexusflow-postgres-data:
  nexusflow-redis-data:
